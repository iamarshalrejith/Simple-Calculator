
name: Simple Calculator CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: mvn -B clean verify

  docker-build-and-push:
    name: Build and Push Docker Image
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            arshalrejith/simple-calculator:latest
            arshalrejith/simple-calculator:${{ github.sha }}

  deploy-to-eks:
    name: Deploy to AWS EKS
    needs: docker-build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - name: Verify AWS authentication
        shell: powershell
        run: |
          aws sts get-caller-identity

          if ($LASTEXITCODE -ne 0) {
            throw "AWS authentication failed"
          }

      - name: Configure EKS access
        shell: powershell
        run: |
          aws eks update-kubeconfig --region ap-southeast-2 --name simple-calculator-eks

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to configure EKS access"
          }

      - name: Verify Kubernetes connection
        shell: powershell
        run: |
          $maxAttempts = 5
          $connected = $false

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Checking EKS connectivity - Attempt $attempt of $maxAttempts"

            kubectl get nodes --request-timeout=30s

            if ($LASTEXITCODE -eq 0) {
              Write-Host "Successfully connected to EKS."
              $connected = $true
              break
            }

            if ($attempt -lt $maxAttempts) {
              Write-Warning "Connection failed. Retrying in 15 seconds..."
              Start-Sleep -Seconds 15
            }
          }

          if (-not $connected) {
            throw "Cannot connect to EKS cluster after $maxAttempts attempts."
          }

      - name: Deploy new Docker image
        shell: powershell
        run: |
          kubectl set image deployment/calculator simple-calculator=arshalrejith/simple-calculator:${{ github.sha }}

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to update Kubernetes deployment"
          }

      - name: Verify deployment rollout
        shell: powershell
        run: |
          $maxAttempts = 5
          $success = $false

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Checking deployment rollout - Attempt $attempt of $maxAttempts"

            kubectl rollout status deployment/calculator --timeout=60s

            if ($LASTEXITCODE -eq 0) {
              Write-Host "Kubernetes rollout successful."
              $success = $true
              break
            }

            if ($attempt -lt $maxAttempts) {
              Write-Warning "Rollout check failed. Retrying in 15 seconds..."
              Start-Sleep -Seconds 15
            }
          }

          if (-not $success) {
            throw "Kubernetes rollout verification failed after $maxAttempts attempts."
          }

      - name: Verify running pods
        shell: powershell
        run: |
          function Invoke-KubectlWithRetry {
            param(
              [string[]]$Arguments,
              [string]$Description
            )

            for ($attempt = 1; $attempt -le 5; $attempt++) {
              Write-Host "$Description - Attempt $attempt of 5"

              & kubectl @Arguments --request-timeout=30s

              if ($LASTEXITCODE -eq 0) {
                return
              }

              if ($attempt -lt 5) {
                Write-Warning "Request failed. Retrying in 10 seconds..."
                Start-Sleep -Seconds 10
              }
            }

            throw "$Description failed after 5 attempts."
          }

          Invoke-KubectlWithRetry -Arguments @("get", "deployment", "calculator") -Description "Verify deployment"

          Invoke-KubectlWithRetry -Arguments @("get", "pods", "-o", "wide") -Description "Verify running pods"
