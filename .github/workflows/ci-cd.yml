name: Simple Calculator CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: mvn -B clean verify

  docker-build-and-push:
    name: Build and Push Docker Image
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            arshalrejith/simple-calculator:latest
            arshalrejith/simple-calculator:${{ github.sha }}

  deploy-to-eks:
    name: Deploy to AWS EKS
    needs: docker-build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Verify AWS authentication
        shell: powershell
        run: |
          aws sts get-caller-identity
          if ($LASTEXITCODE -ne 0) {
            throw "AWS authentication failed"
          }

      - name: Configure EKS access
        shell: powershell
        run: |
          aws eks update-kubeconfig --region ap-southeast-2 --name simple-calculator-eks
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to configure EKS access"
          }

      - name: Verify Kubernetes connection
        shell: powershell
        run: |
          kubectl get nodes
          if ($LASTEXITCODE -ne 0) {
            throw "Cannot connect to EKS cluster"
          }

      - name: Deploy new Docker image
        shell: powershell
        run: |
          kubectl set image deployment/calculator simple-calculator=arshalrejith/simple-calculator:${{ github.sha }}
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to update Kubernetes deployment"
          }

      - name: Verify deployment rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/calculator --timeout=180s
          if ($LASTEXITCODE -ne 0) {
            throw "Kubernetes rollout failed"
          }

      - name: Verify running pods
        shell: powershell
        run: |
          kubectl get deployment calculator
          kubectl get pods -o wide